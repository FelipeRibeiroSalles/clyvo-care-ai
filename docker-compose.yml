version: '3.8'

services:

  h2db:
    image: oscarfonts/h2
    container_name: h2db
    ports:
      - "1521:1521"
      - "8082:81"
      - "9092:9092"
    environment:
      H2_OPTIONS: "-tcp -tcpAllowOthers -tcpPort 9092"
    volumes:
      - h2-data:/opt/h2-data

  app:
    build: .
    container_name: clyvo-api
    ports:
      - "8080:8080"
    depends_on:
      - h2db
    environment:
      SPRING_PROFILES_ACTIVE: docker
    command: sh -c "sleep 15 && java -jar app.jar"

volumes:
  h2-data:
