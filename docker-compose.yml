version: '3.8'

services:

  h2db:
    image: oscarfonts/h2
    container_name: h2db
    ports:
      - "9092:9092"
      - "8082:8082"
    volumes:
      - h2-data:/opt/h2-data

  app:
    build: .
    container_name: clyvo-api
    ports:
      - "8080:8080"
    depends_on:
      - h2db
    environment:
      SPRING_PROFILES_ACTIVE: docker

volumes:
  h2-data:
